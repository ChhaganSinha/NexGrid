name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    name: JS packages (build + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  dotnet:
    name: NexGrid.AspNetCore (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The RCL embeds the vanilla bundle as static web assets, so build JS first.
      - run: npm ci
      - run: npm run build:core && npm run build:vanilla
      - run: dotnet build dotnet/NexGrid.AspNetCore/NexGrid.AspNetCore.csproj -c Release
