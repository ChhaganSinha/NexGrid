name: Publish to NPM & NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish NPM Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests & typecheck
        run: |
          npm run typecheck
          npm test

      - name: Publish @nexgrid/core
        run: npm publish --workspace=@nexgrid/core --access public || echo "@nexgrid/core already published or up-to-date"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nexgrid/vanilla
        run: npm publish --workspace=@nexgrid/vanilla --access public || echo "@nexgrid/vanilla already published or up-to-date"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nexgrid/react
        run: npm publish --workspace=@nexgrid/react --access public || echo "@nexgrid/react already published or up-to-date"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nexgrid/angular
        run: |
          cd packages/angular/dist
          npm publish --access public || echo "@nexgrid/angular already published or up-to-date"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


  publish-nuget:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build static web assets for RCL
        run: |
          npm ci
          npm run build:core && npm run build:vanilla

      - name: Build and Pack TableX.AspNetCore
        run: |
          dotnet pack dotnet/TableX.AspNetCore/TableX.AspNetCore.csproj -c Release -o ./nupkg

      - name: NuGet Login (Trusted Publishing / OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ChhaganSinha

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

