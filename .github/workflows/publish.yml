name: Publish to NPM & NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish NPM Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests & typecheck
        run: |
          npm run typecheck
          npm test

      - name: Publish NPM packages
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set in GitHub Repository Secrets."
            exit 1
          fi

          for pkg_dir in \
            packages/core \
            packages/vanilla \
            packages/react \
            packages/angular/dist \
            packages/vue; do
            pkg_name=$(node -p "require('./${pkg_dir}/package.json').name")
            pkg_version=$(node -p "require('./${pkg_dir}/package.json').version")
            if [ "$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)" = "${pkg_version}" ]; then
              echo "${pkg_name}@${pkg_version} is already published on npm — skipping."
            else
              echo "Publishing ${pkg_name}@${pkg_version}..."
              npm publish "./${pkg_dir}" --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


  publish-nuget:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build static web assets for RCL
        run: |
          npm ci
          npm run build:core && npm run build:vanilla

      - name: Build and Pack TableX.AspNetCore
        run: |
          dotnet pack dotnet/TableX.AspNetCore/TableX.AspNetCore.csproj -c Release -o ./nupkg

      - name: NuGet Login (Trusted Publishing / OIDC)
        id: login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ChhaganSinha

      - name: Push to NuGet.org
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NuGet authentication failed: neither NuGet OIDC login nor NUGET_API_KEY secret produced an API key."
            exit 1
          fi
          dotnet nuget push ./nupkg/*.nupkg --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}

